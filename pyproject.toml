[project]
name = "hindsight-highlights"
version = "0.1.0"
description = "Local Hindsight service ops and configuration playground"
requires-python = ">=3.11,<3.14"
dependencies = [
  "hindsight-api",
  "hindsight-client",
  "python-dotenv",
]

[tool.uv]
package = false

[tool.uv.sources]
# This repo is local ops/config only. Run Hindsight from the checked-out
# upstream source tree under ~/code/vendor/hindsight, not from PyPI wheels.
hindsight-api = { path = "../../vendor/hindsight/hindsight-api", editable = true }
hindsight-api-slim = { path = "../../vendor/hindsight/hindsight-api-slim", editable = true }
hindsight-client = { path = "../../vendor/hindsight/hindsight-clients/python", editable = true }
